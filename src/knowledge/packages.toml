# npm packages that bring public-key cryptography (or a weak hash) into a
# project. Declaring one is not the same as calling it, so these findings are
# reported with lower confidence than a call found in the source.
#
# `uses` lists what the package is for: each entry is an algorithm id from
# algorithms.toml and what it is used for. `review = true` marks packages that
# take the algorithm as configuration (JWT libraries): the dependency is
# listed for manual review because the manifest does not say which one.

# ---- RSA and general public-key toolkits --------------------------------

[[package]]
name = "node-rsa"
uses = [{ algorithm = "rsa", purpose = "unknown" }]

[[package]]
name = "ursa"
uses = [{ algorithm = "rsa", purpose = "unknown" }]

[[package]]
name = "ursa-optional"
uses = [{ algorithm = "rsa", purpose = "unknown" }]

[[package]]
name = "keypair"
uses = [{ algorithm = "rsa", purpose = "unknown" }]

[[package]]
name = "jsencrypt"
uses = [{ algorithm = "rsa", purpose = "encryption" }]

[[package]]
name = "public-encrypt"
uses = [{ algorithm = "rsa", purpose = "encryption" }]

[[package]]
name = "selfsigned"
uses = [{ algorithm = "rsa", purpose = "signature" }]

[[package]]
